<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت محصولات</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071510;color:#eef7f2;font-family:Tahoma,Arial,sans-serif}.wrap{display:flex;min-height:100vh}.side{width:245px;background:#0d211a;border-left:1px solid #1d3c2e;padding:24px 16px}.logo{font-size:22px;font-weight:800;padding:8px 10px 28px}.logo span{color:#63d49a}.nav{display:grid;gap:8px}.nav div{padding:13px 14px;border-radius:12px;color:#a9beb4}.nav .active{background:#173b2b;color:#fff}.main{flex:1;padding:28px 34px;max-width:1300px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{margin:0;font-size:26px}.sub{color:#8fa89d;font-size:13px;margin-top:8px}.btn{border:0;border-radius:12px;padding:12px 18px;background:#38bd78;color:#062014;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#0e241b;border:1px solid #1b3b2d;border-radius:16px;padding:17px}.num{font-size:22px;font-weight:800;margin-top:7px}.muted{color:#8fa89d;font-size:12px}.card{background:#0e241b;border:1px solid #1b3b2d;border-radius:18px;overflow:hidden}.head{padding:17px 20px;border-bottom:1px solid #1b3b2d;display:flex;justify-content:space-between;align-items:center}.tools{display:flex;gap:9px}.search,.select{background:#091a14;border:1px solid #244636;color:#dceee5;border-radius:10px;padding:10px 12px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:right;padding:14px 16px;border-bottom:1px solid #17352a;font-size:13px;white-space:nowrap}.table th{color:#8fa89d;font-weight:500}.pic{width:58px;height:58px;border-radius:12px;background:#17352a}.pill{padding:6px 10px;border-radius:20px;background:#163d2b;color:#62d79a;font-size:11px}.quality{background:#192f27;color:#cde9dc;padding:6px 9px;border-radius:9px;font-size:11px}.actions button{background:#173b2b;border:0;color:#bcebd2;border-radius:9px;padding:7px 10px;margin-left:5px}.low{color:#e2bd73}.off{background:#332a20;color:#d4a66a}@media(max-width:850px){.side{width:76px}.logo{font-size:0}.logo span{font-size:22px}.nav div{font-size:0;text-align:center}.main{padding:20px 14px}.stats{grid-template-columns:1fr 1fr}.table{min-width:950px}.card{overflow:auto}.top{align-items:flex-start;gap:12px}}
.md{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}.md.show{display:flex}
.sh{background:#0e241b;border:1px solid #1b3b2d;border-radius:20px;padding:22px;width:min(560px,100%);max-height:92vh;overflow:auto}.sh h2{margin:0 0 14px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label,.qr label{font-size:12px;color:#8fa89d;display:grid;gap:5px}.fg input,.fg select,.qr input{background:#091a14;border:1px solid #244636;color:#dceee5;border-radius:10px;padding:10px 12px;font:inherit;width:100%}
.qr{display:grid;grid-template-columns:70px 1fr 1fr;gap:8px;align-items:end;margin-top:10px}.qr b{padding-bottom:11px}.ba{display:flex;gap:10px;margin-top:18px}.btn.sec{background:#173b2b;color:#bcebd2}.full{grid-column:1/-1}
.nav a{display:block;padding:13px 14px;border-radius:12px;color:#a9beb4;text-decoration:none}.nav a.active{background:#173b2b;color:#fff}.nav a i{font-style:normal;margin-left:10px}@media(max-width:850px){.nav a{text-align:center;padding:13px 4px}.nav a span{display:none}.nav a i{margin:0}}</style></head><body><div class="wrap"><aside class="side"><div class="logo">تره‌بار <span>آنلاین</span></div><div class="nav"><a href="admin.html"><i>🏠</i><span>داشبورد</span></a><a href="admin_products.html" class="active"><i>🥬</i><span>محصولات</span></a><a href="admin_orders.html"><i>📦</i><span>سفارش‌ها</span></a><a href="admin_customers.html"><i>👥</i><span>مشتری‌ها</span></a><a href="admin_messages.html"><i>💬</i><span>پیام‌ها و جوایز</span></a><a href="admin_settings.html"><i>⚙️</i><span>تنظیمات و اعلان‌ها</span></a></div></aside>
<main class="main"><div class="top"><div><h1>مدیریت محصولات</h1><div class="sub">قیمت، عکس، موجودی و کیفیت محصولات را مدیریت کنید</div></div><button class="btn" onclick="openForm()">＋ افزودن محصول</button></div>
<section class="stats" id="stats"></section>
<section class="card"><div class="head"><strong>لیست محصولات</strong><div class="tools"><input class="search" id="q" oninput="render()" placeholder="جستجوی محصول..."><select class="select" id="flt" onchange="render()"></select></div></div>
<table class="table"><thead><tr><th>تصویر</th><th>محصول</th><th>دسته</th><th>کیفیت‌ها (قیمت · موجودی)</th><th>تخفیف</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="tb"></tbody></table></section></main></div><div class="md" id="md"><div class="sh"><h2 id="mt"></h2><div class="fg"><label>نام محصول<input id="f_n"></label><label>دسته<select id="f_c"></select></label><label>ایموجی<input id="f_e" placeholder="🍅"></label><label class="full">عکس محصول (از گالری یا دوربین)<input type="file" id="f_file" accept="image/*" onchange="compress(this.files[0],640,d=>{f_img.value=d;showPrev()})"></label><input id="f_img" type="hidden"><div class="full" id="f_prev"></div><label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="f_sale" style="width:auto"> نمایش در تخفیف‌های امروز</label></div>
<div class="qr"><b></b><label>قیمت (تومان)</label><label>موجودی (کیلو)</label></div><div id="qs"></div>
<div class="ba"><button class="btn" onclick="saveP()">ذخیره</button><button class="btn sec" onclick="closeForm()">انصراف</button></div></div></div>
<script>// اتصال به Supabase (کلید publishable برای استفاده در مرورگر است)
const SB_URL='https://nbpfmqmgfhghyocfjezh.supabase.co',SB_KEY='sb_publishable_6UIWRuCFFiXGX2fhTS-DjA_Szd7RWDH';
const KV_KEYS=['terebarProducts','terebarSettings','terebarBanners','terebarNotes'];
function sbSess(){try{return JSON.parse(localStorage.sbSession||'null')}catch(e){return null}}
async function sbAuth(grant,body){const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'ورود ناموفق');return{a:d.access_token,r:d.refresh_token,exp:Date.now()/1000+d.expires_in}}
async function sbToken(){let s=sbSess();if(!s)return null;if(s.exp-60<Date.now()/1000){try{s=await sbAuth('refresh_token',{refresh_token:s.r});localStorage.sbSession=JSON.stringify(s)}catch(e){localStorage.removeItem('sbSession');location.reload();return null}}return s.a}
async function sbReq(path,opt){opt=opt||{};const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});if(window.SB_ADMIN){const t=await sbToken();if(t)h.Authorization='Bearer '+t}const r=await fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null}
async function kvSet(k,v){await sbReq('kv',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({key:k,value:v,updated_at:new Date().toISOString()})})}
function kvSave(k,v){try{localStorage[k]=JSON.stringify(v)}catch(e){alert('حجم ذخیره‌سازی پر شد؛ عکس‌ها را کوچک‌تر کنید');return}kvSet(k,v).catch(e=>alert('خطا در ذخیره روی سرور: '+String(e.message).slice(0,200)))}
async function pullKV(){const rows=await sbReq('kv?select=key,value&key=in.('+KV_KEYS.join(',')+')');let ch=false;(rows||[]).forEach(r=>{const s=JSON.stringify(r.value);if(localStorage[r.key]!==s){localStorage[r.key]=s;ch=true}});return ch}
async function ordersPull(){const a=await sbReq('orders?select=id,data&order=id.desc&limit=500');return a.map(x=>Object.assign({},x.data,{id:x.id}))}
async function orderAdd(o,mid,tok){return mid?await sbReq('rpc/place_order_r',{method:'POST',body:JSON.stringify({o,mid,tok})}):await sbReq('rpc/place_order',{method:'POST',body:JSON.stringify({o})})}
async function orderSet(id,o){const d=Object.assign({},o);delete d.id;await sbReq('orders?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({data:d})})}
async function ordersMine(list){return list.length?sbReq('rpc/my_orders',{method:'POST',body:JSON.stringify({p:list})}):[]}
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
async function msgAdd(m){return await sbReq('rpc/send_message',{method:'POST',body:JSON.stringify({m})})}
async function msgsMine(t){return sbReq('rpc/my_messages',{method:'POST',body:JSON.stringify({p:t})})}
async function msgsPull(){const a=await sbReq('messages?select=id,data&order=id.desc&limit=300');return a.map(x=>Object.assign({},x.data,{id:x.id}))}
async function msgSet(id,m){const d=Object.assign({},m);delete d.id;await sbReq('messages?id=eq.'+id,{method:'PATCH',headers:{Prefer:'return=minimal'},body:JSON.stringify({data:d})})}
async function adminSync(fn){try{await pullKV();localStorage.terebarOrders=JSON.stringify(await ordersPull());try{localStorage.terebarMsgsAll=JSON.stringify(await msgsPull())}catch(e){}navBadge();fn()}catch(e){console.warn(e)}}
function adminGate(){window.SB_ADMIN=true;const d=document.createElement('div');
if(sbSess()){d.innerHTML='<button style="position:fixed;bottom:10px;left:10px;z-index:90;background:#173b2b;color:#bcebd2;border:0;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer" onclick="localStorage.removeItem(\'sbSession\');location.reload()">خروج</button>'}
else{d.innerHTML='<div style="position:fixed;inset:0;z-index:99;background:#071410;display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;padding:24px;font-family:Vazirmatn,Tahoma,sans-serif;color:#eef5f1"><div style="font-size:54px">🥬</div><h2 style="margin:0">ورود مدیر</h2><input id="lg_e" type="email" placeholder="ایمیل" style="width:100%;max-width:320px;padding:13px;border-radius:12px;border:0;font:inherit"><input id="lg_p" type="password" placeholder="رمز عبور" style="width:100%;max-width:320px;padding:13px;border-radius:12px;border:0;font:inherit"><button style="width:100%;max-width:320px;padding:13px;border-radius:12px;border:0;background:#1fa95b;color:#fff;font:inherit;font-weight:700;cursor:pointer" onclick="doLogin()">ورود</button></div>'}
document.body.appendChild(d);navBadge()}
async function doLogin(){try{localStorage.sbSession=JSON.stringify(await sbAuth('password',{email:document.getElementById('lg_e').value.trim(),password:document.getElementById('lg_p').value}));location.reload()}catch(e){alert('ورود ناموفق: '+e.message)}}
function navBadge(){try{const n=JSON.parse(localStorage.terebarMsgsAll||'[]').filter(m=>m.type==='جایزه'?m.status==='pending':(m.status==='open'&&!(m.replies||[]).length)).length,a=document.querySelector('a[href="admin_messages.html"]');if(!a)return;let b=a.querySelector('b');if(!b){b=document.createElement('b');b.style.cssText='background:#e5484d;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-right:6px;font-style:normal';a.appendChild(b)}b.textContent=n||'';b.style.display=n?'':'none'}catch(e){}}
</script><script>adminGate();</script><script>
const DEF=[{id:1,n:'گوجه فرنگی',c:'صیفی‌جات',e:'🍅',q:[['لوکس',69000,12],['درجه یک',52000,25],['درجه دو',39000,30]],sale:true},{id:2,n:'خیار',c:'صیفی‌جات',e:'🥒',q:[['لوکس',58000,10],['درجه یک',45000,22],['درجه دو',33000,28]],sale:true},{id:3,n:'سیب قرمز',c:'میوه',e:'🍎',q:[['لوکس',98000,8],['درجه یک',79000,18],['درجه دو',62000,20]],sale:true},{id:4,n:'سیب‌زمینی',c:'محصولات زمینی',e:'🥔',q:[['لوکس',62000,9],['درجه یک',48000,25],['درجه دو',35000,30]],sale:false},{id:5,n:'سبزی خوردن',c:'سبزیجات',e:'🌿',q:[['لوکس',75000,8],['درجه یک',59000,18],['درجه دو',42000,25]],sale:false},{id:6,n:'موز',c:'میوه',e:'🍌',q:[['لوکس',125000,8],['درجه یک',99000,16],['درجه دو',79000,20]],sale:false}];
const CATS=['میوه','سبزیجات','صیفی‌جات','محصولات زمینی','خشکبار'],QL=['لوکس','درجه یک','درجه دو'],fa=n=>Number(n).toLocaleString('fa-IR');
function load(){const a=localStorage.terebarProducts;if(!a){localStorage.terebarProducts=JSON.stringify(DEF);return JSON.parse(JSON.stringify(DEF))}return JSON.parse(a)}
function save(a){kvSave('terebarProducts',a);render()}
function compress(f,max,cb){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.onerror=()=>alert('فایل تصویر معتبر نیست');im.src=r.result};r.readAsDataURL(f)}
function showPrev(){f_prev.innerHTML=f_img.value?`<img src="${f_img.value}" alt="" style="height:90px;border-radius:10px;vertical-align:middle"> <button type="button" class="btn sec" style="padding:6px 12px" onclick="f_img.value='';showPrev()">حذف عکس</button>`:''}
const tog=id=>{const a=load(),p=a.find(x=>x.id==id);p.active=p.active===false;save(a)};
const del=id=>{if(confirm('این محصول حذف شود؟'))save(load().filter(x=>x.id!=id))};
let ed=null;
function openForm(id){ed=id||null;const p=id?load().find(x=>x.id==id):{n:'',c:CATS[0],e:'🥬',img:'',sale:false,q:[[QL[0],0,0],[QL[1],0,0],[QL[2],0,0]]};
document.getElementById('mt').textContent=id?'ویرایش محصول':'افزودن محصول';f_n.value=p.n;f_c.value=p.c;f_e.value=p.e;f_img.value=p.img||'';f_file.value='';showPrev();f_sale.checked=!!p.sale;
document.getElementById('qs').innerHTML=p.q.map((x,i)=>`<div class="qr"><b>${QL[i]}</b><input type="number" min="0" id="f_p${i}" value="${x[1]}"><input type="number" min="0" id="f_s${i}" value="${x[2]}"></div>`).join('');md.classList.add('show')}
const closeForm=()=>md.classList.remove('show');
function saveP(){const n=f_n.value.trim();if(!n){alert('نام محصول را وارد کنید');return}
const q=QL.map((l,i)=>[l,+document.getElementById('f_p'+i).value||0,+document.getElementById('f_s'+i).value||0]);if(q.some(x=>x[1]<=0)){alert('قیمت هر سه کیفیت باید بیشتر از صفر باشد');return}
const a=load(),old=a.find(x=>x.id==ed),p={id:ed||Math.max(0,...a.map(x=>x.id))+1,n,c:f_c.value,e:f_e.value||'🥬',img:f_img.value.trim(),sale:f_sale.checked,active:old?old.active:true,q};
if(old)Object.assign(old,p);else a.push(p);save(a);closeForm()}
function render(){const a=load(),q=document.getElementById('q').value.trim(),c=document.getElementById('flt').value,low=p=>p.q.some(x=>x[2]<5);
document.getElementById('stats').innerHTML=[['کل محصولات',a.length,''],['محصول فعال',a.filter(p=>p.active!==false).length,''],['موجودی کم',a.filter(low).length,'low'],['غیرفعال',a.filter(p=>p.active===false).length,'']].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><div class="num ${x[2]}">${fa(x[1])}</div></div>`).join('');
document.getElementById('tb').innerHTML=a.filter(p=>(!q||p.n.includes(q))&&(!c||p.c===c)).map(p=>`<tr><td><div class="pic" style="display:grid;place-items:center;font-size:30px;overflow:hidden">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:p.e}</div></td><td><b>${p.n}</b></td><td>${p.c}</td><td>${p.q.map(x=>`<div><span class="quality">${x[0]}</span> ${fa(x[1])} · <span class="${x[2]<5?'low':''}">${fa(x[2])} کیلو</span></div>`).join('')}</td><td>${p.sale?'<span class="pill">دارد</span>':'—'}</td><td><button class="pill ${p.active===false?'off':''}" style="border:0;cursor:pointer" onclick="tog(${p.id})">${p.active===false?'غیرفعال':'فعال'}</button></td><td class="actions"><button onclick="openForm(${p.id})">ویرایش</button><button onclick="del(${p.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px" class="muted">محصولی پیدا نشد</td></tr>'}
flt.innerHTML='<option value="">همه دسته‌ها</option>'+CATS.map(c=>`<option>${c}</option>`).join('');f_c.innerHTML=CATS.map(c=>`<option>${c}</option>`).join('');
addEventListener('storage',e=>{if(e.key==='terebarProducts')render()});render();
adminSync(typeof first!=='undefined'?()=>{first=1;render()}:render);setInterval(()=>adminSync(render),10000);
</script></body></html>
