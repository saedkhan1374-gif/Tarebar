async function sbReq(path,opt){opt=opt||{};const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});if(window.SB_ADMIN){const t=await sbToken();if(t)h.Authorization='Bearer '+t}const r=await fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body});if(!r.ok){let e=await r.text();try{e=JSON.parse(e).message||e}catch(x){}throw new Error(e)}const t=await r.text();return t?JSON.parse(t):null}

function showCatPrev(){document.getElementById('c_prev').innerHTML=cImg?`<img src="${cImg}" alt="" style="height:70px;border-radius:10px;vertical-align:middle"> <button type="button" class="btn sec" style="padding:6px 12px" onclick="cImg='';showCatPrev()">حذف عکس</button>`:''}
function showCats(){const l=catList(),P=load(),e=cEd>=0?l[cEd]:{n:'',e:'🥬'};
document.getElementById('cmb').innerHTML=`<h2>دسته‌بندی‌ها</h2><div style="margin:8px 0 14px">${l.map((c,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #1b3b2d"><div style="width:44px;height:44px;border-radius:10px;background:#173b2b;display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none">${c.img?`<img src="${c.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:esc(c.e||'')}</div><div style="flex:1"><b>${esc(c.n)}</b><div class="muted">${fa(P.filter(p=>p.c===c.n).length)} محصول</div></div><button class="btn sec" style="padding:5px 9px" onclick="mvC(${i},-1)">↑</button><button class="btn sec" style="padding:5px 9px" onclick="mvC(${i},1)">↓</button><button class="btn sec" style="padding:5px 10px" onclick="edC(${i})">ویرایش</button><button class="btn sec" style="padding:5px 10px" onclick="delC(${i})">حذف</button></div>`).join('')||'<div class="muted">دسته‌ای نیست</div>'}</div><h3>${cEd>=0?'ویرایش دسته':'افزودن دسته'}</h3><div class="fg"><label>نام دسته<input id="c_n" value="${esc(e.n)}"></label><label>ایموجی<input id="c_e" value="${esc(e.e||'')}"></label><label class="full">عکس دسته (اختیاری)<input type="file" accept="image/*" onchange="compress(this.files[0],300,d=>{cImg=d;showCatPrev()})"></label><div class="full" id="c_prev"></div></div><div class="ba"><button class="btn" onclick="saveC()">${cEd>=0?'ذخیره تغییرات':'افزودن'}</button>${cEd>=0?'<button class="btn sec" onclick="cancelC()">لغو ویرایش</button>':''}<button class="btn sec" onclick="closeCats()">بستن</button></div>`;showCatPrev()}
function saveC(){const n=document.getElementById('c_n').value.trim(),em=document.getElementById('c_e').value.trim()||'🥬';if(!n){alert('نام دسته را وارد کنید');return}const l=catList().slice();if(l.some((c,i)=>c.n===n&&i!==cEd)){alert('این نام قبلاً وجود دارد');return}
if(cEd>=0){const old=l[cEd].n;l[cEd]={n,e:em,img:cImg};if(old!==n){const P=load();let ch=false;P.forEach(p=>{if(p.c===old){p.c=n;ch=true}});if(ch)kvSave('terebarProducts',P)}}else l.push({n,e:em,img:cImg});
kvSave('terebarCats',l);cEd=-1;cImg='';showCats();render()}
function delC(i){const l=catList().slice(),c=l[i],cnt=load().filter(p=>p.c===c.n).length;if(!confirm(cnt?'این دسته '+cnt+' محصول دارد؛ محصولات می‌مانند ولی دیگر در این دسته نمایش داده نمی‌شوند. حذف شود؟':'این دسته حذف شود؟'))return;l.splice(i,1);kvSave('terebarCats',l);cEd=-1;cImg='';showCats();render()}
function mvC(i,d){const l=catList().slice(),j=i+d;if(j<0||j>=l.length)return;const x=l[i];l[i]=l[j];l[j]=x;kvSave('terebarCats',l);showCats();render()}
function openForm(id){ed=id||null;const p=id?load().find(x=>x.id==id):{n:'',c:(catList()[0]||{n:''}).n,e:'🥬',img:'',sale:false,q:[[QL[0],0,0],[QL[1],0,0],[QL[2],0,0]]};
document.getElementById('mt').textContent=id?'ویرایش محصول':'افزودن محصول';f_n.value=p.n;f_c.value=p.c;f_e.value=p.e;f_d.value=p.disc||0;f_u.value=p.unit||'';f_ds.value=p.desc||'';f_img.value=p.img||'';f_file.value='';showPrev();f_sale.checked=!!p.sale;
document.getElementById('qs').innerHTML=p.q.map((x,i)=>`<div class="qr"><input id="f_l${i}" value="${esc(x[0])}"><input type="number" min="0" id="f_p${i}" value="${x[1]}"><input type="number" min="0" id="f_s${i}" value="${x[2]}"></div>`).join('');md.classList.add('show')}
const closeForm=()=>md.classList.remove('show');
function saveP(){const n=f_n.value.trim();if(!n){alert('نام محصول را وارد کنید');return}
const q=QL.map((l,i)=>[document.getElementById('f_l'+i).value.trim()||l,+document.getElementById('f_p'+i).value||0,+document.getElementById('f_s'+i).value||0]);if(q.some(x=>x[1]<=0)){alert('قیمت هر سه کیفیت باید بیشتر از صفر باشد');return}
const a=load(),old=a.find(x=>x.id==ed),p={id:ed||Math.max(0,...a.map(x=>x.id))+1,n,c:f_c.value,e:f_e.value||'🥬',img:f_img.value.trim(),sale:f_sale.checked,disc:Math.min(90,Math.max(0,+f_d.value||0)),unit:f_u.value.trim(),desc:f_ds.value.trim(),active:old?old.active:true,q};
if(old)Object.assign(old,p);else a.push(p);save(a);closeForm()}
function render(){fillCats();const a=load(),q=document.getElementById('q').value.trim(),c=document.getElementById('flt').value,low=p=>p.q.some(x=>x[2]<5);
document.getElementById('stats').innerHTML=[['کل محصولات',a.length,''],['محصول فعال',a.filter(p=>p.active!==false).length,''],['موجودی کم',a.filter(low).length,'low'],['غیرفعال',a.filter(p=>p.active===false).length,'']].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><div class="num ${x[2]}">${fa(x[1])}</div></div>`).join('');
document.getElementById('tb').innerHTML=a.filter(p=>(!q||p.n.includes(q))&&(!c||p.c===c)).map(p=>`<tr><td><div class="pic" style="display:grid;place-items:center;font-size:30px;overflow:hidden">${p.img?`<img src="${p.img}" alt="" style="width:100%;height:100%;object-fit:cover">`:p.e}</div></td><td><b>${p.n}</b></td><td>${p.c}</td><td>${p.q.map(x=>`<div><span class="quality">${x[0]}</span> ${fa(x[1])} · <span class="${x[2]<5?'low':''}">${fa(x[2])} کیلو</span></div>`).join('')}</td><td>${(p.disc?'<span class="pill">'+p.disc+'٪</span> ':'')+(p.sale?'<span class="pill">امروز</span>':'')||'—'}</td><td><button class="pill ${p.active===false?'off':''}" style="border:0;cursor:pointer" onclick="tog(${p.id})">${p.active===false?'غیرفعال':'فعال'}</button></td><td class="actions"><button onclick="openForm(${p.id})">ویرایش</button><button onclick="del(${p.id})">حذف</button></td></tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:30px" class="muted">محصولی پیدا نشد</td></tr>'}

addEventListener('storage',e=>{if(e.key==='terebarProducts')render()});render();
adminSync(typeof first!=='undefined'?()=>{first=1;render()}:render);setInterval(()=>adminSync(render),10000);
</script></body></html>
