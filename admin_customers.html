async function sbAuth(grant,body){const r=await fetch(SB_URL+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw new Error(d.error_description||d.msg||'ورود ناموفق');return{a:d.access_token,r:d.refresh_token,exp:Date.now()/1000+d.expires_in}}

async function sbReq(path,opt){opt=opt||{};const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},opt.headers||{});if(window.SB_ADMIN){const t=await sbToken();if(t)h.Authorization='Bearer '+t}const r=await fetch(SB_URL+'/rest/v1/'+path,{method:opt.method||'GET',headers:h,body:opt.body});if(!r.ok){let e=await r.text();try{e=JSON.parse(e).message||e}catch(x){}throw new Error(e)}const t=await r.text();return t?JSON.parse(t):null}

function newOrderWatch(){try{const O=JSON.parse(localStorage.terebarOrders||'[]');if(!O.length)return;const mx=Math.max(...O.map(x=>x.id));if(localStorage.adminSeen==null){localStorage.adminSeen=mx;return}const nw=O.filter(x=>x.status===0&&x.id>+localStorage.adminSeen);if(!nw.length)return;let b=document.getElementById('nwBar');if(!b){b=document.createElement('div');b.id='nwBar';b.style.cssText='position:fixed;top:0;left:0;right:0;z-index:200;background:#e5484d;color:#fff;padding:14px;text-align:center;font:700 15px Vazirmatn,Tahoma,sans-serif;cursor:pointer';b.onclick=dismissAlarm;document.body.appendChild(b);beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}try{if(window.Notification&&Notification.permission==='granted')new Notification('سفارش جدید',{body:'سفارش #'+nw[0].id+' ثبت شد'})}catch(e){}clearInterval(alarmT);alarmT=setInterval(()=>{beep();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}},4000)}b.textContent='🔔 '+nw.length.toLocaleString('fa-IR')+' سفارش جدید — برای توقف هشدار اینجا بزن'}catch(e){}}

</script><script>adminGate();</script><script>const fa=n=>Number(n).toLocaleString('fa-IR'),ST=['جدید','تأیید شده','در حال آماده‌سازی','آماده ارسال','ارسال شده','تحویل شده'],J=(k,d)=>JSON.parse(localStorage[k]||d);

<h3>مدیریت مشتری</h3><div class="fg" style="margin-bottom:10px"><label class="full" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cf_b" ${cf.blocked?'checked':''} style="width:auto"> مسدود (امکان ثبت سفارش ندارد)</label><label>تعدیل دستی امتیاز (مثبت یا منفی)<input type="number" id="cf_a" value="${cf.adj||0}"></label><label>یادداشت داخلی (فقط مدیر)<input id="cf_n" value="${esc(cf.note||'')}"></label></div><div class="ba" style="margin:0 0 12px"><button class="btn" onclick="cfSave()">ذخیره</button></div><div class="fg" style="margin-bottom:10px"><label class="full">اعلان فقط برای این مشتری<input id="cn_t" placeholder="عنوان"></label><label class="full"><input id="cn_b" placeholder="متن اعلان"></label></div><button class="btn" onclick="cfNote()">ارسال اعلان</button>
<h3>سفارش‌ها</h3>${O.map(o=>`<div class="stat" style="margin-bottom:8px"><b>#${o.id}</b> · ${new Date(o.created).toLocaleDateString('fa-IR')} · ${fa(o.total)} تومان · ${o.status<0?'لغو شده':ST[o.status]}<div class="muted">${o.items.map(i=>esc(i.n)+' '+esc(i.ql)+' ×'+fa(i.qty)).join('، ')}</div>${o.note?`<div class="muted">📝 ${esc(o.note)}</div>`:''}</div>`).join('')||'<div class="muted">سفارشی ندارد</div>'}
<h3>پیام‌ها و درخواست‌ها</h3>${M.map(m=>`<div class="stat" style="margin-bottom:8px"><div class="muted">${esc(m.type)} · ${new Date(m.created).toLocaleDateString('fa-IR')} ${stt(m)}</div><div style="margin:4px 0">${esc(m.text)}</div>${(m.replies||[]).map(r=>`<div class="muted" style="border-right:3px solid #1fa95b;padding-right:8px;margin:3px 0">پاسخ: ${esc(r.t)}</div>`).join('')}<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><input id="cr${m.id}" placeholder="پاسخ..." style="flex:1;min-width:140px;background:#091a14;border:1px solid #244636;color:#dceee5;border-radius:10px;padding:8px 10px;font:inherit"><button class="btn" onclick="repC(${m.id})">پاسخ</button>${m.type==='جایزه'&&m.status==='pending'?`<button class="btn" onclick="setC(${m.id},'approved')">تأیید جایزه</button><button class="btn sec" onclick="setC(${m.id},'rejected')">رد</button>`:''}</div></div>`).join('')||'<div class="muted">پیامی ندارد</div>'}
<div class="ba"><button class="btn sec" onclick="document.getElementById('cmd').classList.remove('show')">بستن</button></div>`;document.getElementById('cmd').classList.add('show')}
function mutC(id,fn){const a=J('terebarMsgsAll','[]'),m=a.find(x=>x.id==id);if(!m)return;fn(m);localStorage.terebarMsgsAll=JSON.stringify(a);msgSet(id,m).catch(e=>alert('خطا: '+String(e.message).slice(0,200)));showC()}
function putCust(k,d){const a=J('terebarCustAll','[]'),r=a.find(x=>x.phone===k);if(r)r.data=d;else a.push({phone:k,data:d});localStorage.terebarCustAll=JSON.stringify(a);custSet(k,d).catch(e=>alert('خطا: '+String(e.message).slice(0,200)));showC()}
const curCf=()=>(J('terebarCustAll','[]').find(x=>x.phone===nph(CP))||{data:{}}).data;
function cfSave(){putCust(nph(CP),Object.assign({},curCf(),{blocked:document.getElementById('cf_b').checked,adj:+document.getElementById('cf_a').value||0,note:document.getElementById('cf_n').value.trim()}))}
function cfNote(){const t=document.getElementById('cn_t').value.trim(),b=document.getElementById('cn_b').value.trim();if(!t)return;const cur=curCf();putCust(nph(CP),Object.assign({},cur,{notes:(cur.notes||[]).concat([{t,b,d:Date.now()}])}))}
const setC=(id,s)=>mutC(id,m=>{m.status=s});
const repC=id=>{const t=document.getElementById('cr'+id).value.trim();if(t)mutC(id,m=>{(m.replies=m.replies||[]).push({t,d:Date.now()})})};
function render(){const m={},q=document.getElementById('q').value.trim();J('terebarOrders','[]').forEach(x=>{const c=m[nph(x.phone)]=m[nph(x.phone)]||{name:x.name,phone:x.phone,n:0,t:0,d:0,last:0,addr:''};if(x.status>=0){c.n++;c.t+=x.total}if(x.status>=5)c.d+=x.total;if(x.created>c.last){c.last=x.created;c.addr=x.address;c.name=x.name}});
const l=Object.values(m).filter(c=>!q||c.name.includes(q)||c.phone.includes(q));
document.getElementById('tb').innerHTML=(window.L=l).map((c,i)=>`<tr style="cursor:pointer" onclick="cust(${i})"><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)}</td><td>${fa(c.n)}</td><td>${fa(c.t)} تومان</td><td>${fa(Math.floor(c.d/(J('terebarSettings','{}').ptsPer||10000))-usedPts(c.phone)+adjOf(c.phone))}</td><td>${new Date(c.last).toLocaleDateString('fa-IR')}</td><td style="white-space:normal">${esc(c.addr)}</td></tr>`).join('')||'<tr><td colspan="7" class="muted" style="text-align:center;padding:24px">مشتری‌ای وجود ندارد</td></tr>'}
addEventListener('storage',()=>render());render();adminSync(typeof first!=='undefined'?()=>{first=1;render()}:render);setInterval(()=>adminSync(render),10000);
</script></body></html>
